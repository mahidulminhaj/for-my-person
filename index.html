<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>For My Person ❤️</title>
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background-color: #fceade;
            font-family: 'Poppins', sans-serif;
            color: #5a3e36;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
        }
        .container {
            width: 100%;
            max-width: 430px;
            text-align: center;
            padding: 20px;
            z-index: 2;
        }

        /* --- Updated Flowers Burst Particles --- */
        .flower-particle {
            position: absolute;
            user-select: none;
            pointer-events: none;
            z-index: 10;
            opacity: 0; /* Starts invisible */
            /* Randomize font size slightly for variety */
            font-size: calc(20px + (10 * var(--rand-size))); 
            animation: ultimateBurst 2s cubic-bezier(0.1, 0.8, 0.3, 1) forwards;
        }

        @keyframes ultimateBurst {
            0% {
                opacity: 0;
                transform: translate(0, 0) scale(0.3) rotate(0deg);
            }
            15% {
                opacity: 1; /* Quick fade in */
            }
            60% {
                opacity: 1; /* Main burst phase */
            }
            100% {
                opacity: 0; /* Slow fade out */
                transform: translate(var(--tx), var(--ty)) scale(var(--final-scale)) rotate(var(--rot));
            }
        }

        /* --- Updated Gif Box styles for a slightly bigger box --- */
        .gift-box {
            font-size: 100px; /* Slightly bigger box to match the intense burst */
            cursor: pointer;
            animation: bounce 2s infinite;
            margin-bottom: 25px;
            user-select: none;
            transition: transform 0.2s ease;
            display: inline-block; /* Required for transform */
        }
        .gift-box:active {
            transform: scale(0.85); /* Slightly more aggressive shrink on click */
        }

        /* Step 1 text styling remains the same */

        @keyframes bounce {
            0%, 20%, 50%, 80%, 100% { transform: translateY(0); }
            40% { transform: translateY(-25px); }
            60% { transform: translateY(-12px); }
        }

        /* --- Step 2 styles (unmodified) --- */
        #step2 {
            display: none;
            animation: fadeIn 1.2s ease forwards;
        }
        .main-title {
            font-family: 'Caveat', cursive;
            font-size: 3.2rem;
            color: #8b2626;
            margin-bottom: 0px;
            line-height: 1.1;
        }
        .sub-title {
            font-family: 'Caveat', cursive;
            font-size: 1.6rem;
            color: #6b4338;
            margin-bottom: 25px;
            font-style: italic;
        }
        .couple-img {
            width: 240px;
            max-width: 80%;
            height: auto;
            border-radius: 15px;
            margin: 0 auto 20px auto;
            display: block;
            cursor: pointer;
            transition: transform 0.3s ease;
        }
        .couple-img:hover {
            transform: scale(1.03);
        }
        .nav-dots {
            font-size: 18px;
            color: #b57a70;
            cursor: pointer;
            letter-spacing: 5px;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(15px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <!-- Background Music (0:00 start) -->
    <audio id="bgMusic" loop preload="auto">
        <source src="music.mp3" type="audio/mpeg">
    </audio>

    <div class="container">
        <!-- Step 1: Gift Box (updated burst trigger) -->
        <div id="step1">
            <div class="gift-box" onclick="triggerUltimateFlowerBurst(event)">🎁</div>
            <h1 style="font-family: 'Caveat', cursive; font-size: 2.3rem; color: #8b3a3a; margin-bottom: 8px;">For you, my baby.</h1>
            <p style="font-size: 0.95rem; color: #a06e62; font-style: italic;">(Tap to open)</p>
        </div>

        <!-- Step 2: Couple Card (unmodified) -->
        <div id="step2">
            <h1 class="main-title">From me to you.</h1>
            <p class="sub-title">This is how much I love you.</p>
            <img src="couple.png" alt="Couple Illustration" class="couple-img" onclick="goToStep3()">
            <div class="nav-dots" onclick="goToStep3()">✦ ♡ ✦</div>
        </div>
    </div>

    <script>
        // --- Updated Ultimate Flower Burst Logic ---
        function triggerUltimateFlowerBurst(e) {
            const flowers = ['🌸', '🌹', '🌺', '🌷', '✨', '💖', '💐', '💞'];
            const totalCount = 100; // MUCH more flowers (original was 30)
            const burstRadius = 400; // Increased radius

            for (let i = 0; i < totalCount; i++) {
                const flower = document.createElement('div');
                flower.className = 'flower-particle';
                flower.innerText = flowers[Math.floor(Math.random() * flowers.length)];

                // Initial position at the click point
                const clickX = e.clientX;
                const clickY = e.clientY;
                flower.style.left = clickX + 'px';
                flower.style.top = clickY + 'px';

                // Random burst direction and distance
                const angle = Math.random() * Math.PI * 2; // Full circle
                // Distribute distance more evenly
                const distance = 50 + Math.random() * burstRadius; 

                const tx = Math.cos(angle) * distance + 'px';
                const ty = Math.sin(angle) * distance + 'px';
                
                // Random scale and rotation for end state
                const finalScale = 0.8 + Math.random() * 1.5;
                const rot = (Math.random() * 1440) + 'deg'; // More spins
                
                // CSS Variables for animation
                flower.style.setProperty('--tx', tx);
                flower.style.setProperty('--ty', ty);
                flower.style.setProperty('--rot', rot);
                flower.style.setProperty('--final-scale', finalScale);
                flower.style.setProperty('--rand-size', Math.random()); // For random font sizes

                // Small random delay for staggered effect
                flower.style.animationDelay = (Math.random() * 0.3) + 's';

                document.body.appendChild(flower);

                // Clean up particle after animation
                setTimeout(() => flower.remove(), 2500); // Wait for full 2s + 0.3s delay
            }

            // --- Step Transition (unmodified, slight delay tweak) ---
            var music = document.getElementById('bgMusic');
            if(music) {
                music.currentTime = 0;
                music.play().catch(function(err) { console.log("Audio error:", err); });
            }

            // Slightly longer delay to let the initial intense burst happen
            setTimeout(() => {
                document.getElementById('step1').style.display = 'none';
                document.getElementById('step2').style.display = 'block';
            }, 800); // 800ms to allow the burst peak
        }

        function goToStep3() {
            // Next step placeholder
            console.log("Proceeding to Step 3");
        }
    </script>

</body>
</html>
