<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>For My Person ❤️</title>
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background-color: #fceade;
            font-family: 'Poppins', sans-serif;
            color: #5a3e36;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
        }
        .container {
            width: 100%;
            max-width: 430px;
            text-align: center;
            padding: 20px;
            z-index: 2;
        }

        /* Flower Burst Particles */
        .flower-particle {
            position: absolute;
            font-size: 24px;
            user-select: none;
            pointer-events: none;
            z-index: 10;
            animation: burst 1.5s cubic-bezier(0.25, 1, 0.5, 1) forwards;
        }

        @keyframes burst {
            0% {
                opacity: 1;
                transform: translate(0, 0) scale(0.5) rotate(0deg);
            }
            100% {
                opacity: 0;
                transform: translate(var(--tx), var(--ty)) scale(1.4) rotate(var(--rot));
            }
        }

        /* Step 1 Styles */
        .gift-box {
            font-size: 80px;
            cursor: pointer;
            animation: bounce 2s infinite;
            margin-bottom: 20px;
            user-select: none;
            transition: transform 0.3s ease;
        }
        .gift-box:active {
            transform: scale(0.9);
        }
        @keyframes bounce {
            0%, 20%, 50%, 80%, 100% { transform: translateY(0); }
            40% { transform: translateY(-20px); }
            60% { transform: translateY(-10px); }
        }

        /* Step 2 Styles */
        #step2 {
            display: none;
            animation: fadeIn 1.2s ease forwards;
        }
        .main-title {
            font-family: 'Caveat', cursive;
            font-size: 3.2rem;
            color: #8b2626;
            margin-bottom: 0px;
            line-height: 1.1;
        }
        .sub-title {
            font-family: 'Caveat', cursive;
            font-size: 1.6rem;
            color: #6b4338;
            margin-bottom: 25px;
            font-style: italic;
        }
        .couple-img {
            width: 240px;
            max-width: 80%;
            height: auto;
            border-radius: 15px;
            margin: 0 auto 20px auto;
            display: block;
            cursor: pointer;
            transition: transform 0.3s ease;
        }
        .couple-img:hover {
            transform: scale(1.03);
        }
        .nav-dots {
            font-size: 18px;
            color: #b57a70;
            cursor: pointer;
            letter-spacing: 5px;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(15px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <audio id="bgMusic" loop preload="auto">
        <source src="music.mp3" type="audio/mpeg">
    </audio>

    <div class="container">
        <div id="step1">
            <div class="gift-box" onclick="openGift(event)">🎁</div>
            <h1 style="font-family: 'Caveat', cursive; font-size: 2.3rem; color: #8b3a3a; margin-bottom: 8px;">For you, my baby.</h1>
            <p style="font-size: 0.95rem; color: #a06e62; font-style: italic;">(Tap to open)</p>
        </div>

        <div id="step2">
            <h1 class="main-title">From me to you.</h1>
            <p class="sub-title">This is how much I love you.</p>
            <img src="couple.png" alt="Couple Illustration" class="couple-img" onclick="goToStep3()">
            <div class="nav-dots" onclick="goToStep3()">✦ ♡ ✦</div>
        </div>
    </div>

    <script>
        function createFlowerBurst(e) {
            const flowers = ['🌸', '🌹', '🌺', '🌷', '✨', '💖'];
            const count = 30;
            
            for (let i = 0; i < count; i++) {
                const flower = document.createElement('div');
                flower.className = 'flower-particle';
                flower.innerText = flowers[Math.floor(Math.random() * flowers.length)];
                
                flower.style.left = e.clientX + 'px';
                flower.style.top = e.clientY + 'px';
                
                const angle = Math.random() * Math.PI * 2;
                const distance = 150 + Math.random() * 200; 
                
                const tx = Math.cos(angle) * distance + 'px';
                const ty = Math.sin(angle) * distance + 'px';
                const rot = (Math.random() * 360) + 'deg';
                
                flower.style.setProperty('--tx', tx);
                flower.style.setProperty('--ty', ty);
                flower.style.setProperty('--rot', rot);
                
                document.body.appendChild(flower);
                
                setTimeout(() => flower.remove(), 1500);
            }
        }

        function openGift(e) {
            var music = document.getElementById('bgMusic');
            if(music) {
                music.currentTime = 0; // গান একদম 0 সেকেন্ড থেকে শুরু হবে
                music.play().catch(function(err) { console.log("Audio error:", err); });
            }

            createFlowerBurst(e);

            setTimeout(() => {
                document.getElementById('step1').style.display = 'none';
                document.getElementById('step2').style.display = 'block';
            }, 600);
        }

        function goToStep3() {
            console.log("Next step");
        }
    </script>

</body>
</html>
